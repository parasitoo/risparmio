<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Risparmio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Risparmio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121715" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1b2420; --muted:#5d6a63; --line:#d9dfdb;
  --accent:#0f6b58; --accent-soft:#e1efe9; --plan:#8a968f; --warn:#a4560c; --good:#2c7a3f;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121715; --surface:#1a211e; --fg:#e4ebe7; --muted:#97a69e; --line:#2c3632;
  --accent:#4fc2a3; --accent-soft:#1d332c; --plan:#6f7d76; --warn:#e3a35c; --good:#6ccf84; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);overflow-x:hidden;touch-action:pan-y;overscroll-behavior-x:none}
button,input{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.progress{display:flex;flex-direction:column;gap:8px}
.progress .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-size:28px;font-weight:600;color:var(--accent)}
.of{color:var(--muted);font-size:14px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;position:relative}
.bar i,.bar b{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:var(--accent)}
.bar b{opacity:.25}
.proj{font-size:13.5px;color:var(--muted)}
.months{display:flex;flex-direction:column;gap:10px}
.yr{font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin:0 0 5px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tab{font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 2px 7px;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;cursor:pointer}
.tab .t{font-weight:600;font-size:14px}
.tab .a{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tab.done .a{color:var(--good)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:17px;font-weight:600}
.per{margin:2px 0 0;font-size:13px;color:var(--muted)}
.rows{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.k{color:var(--muted)}
.v{text-align:right}
.inrow{display:flex;align-items:center;gap:10px;justify-content:flex-end}
input{width:120px;font:inherit;font-size:16px;font-variant-numeric:tabular-nums;text-align:right;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);-webkit-appearance:none;appearance:none}
input.txt{text-align:left;width:100%}
input::placeholder{color:var(--plan)}
.link{font:inherit;font-size:13px;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;white-space:nowrap;cursor:pointer}
.rk{font:inherit;background:none;border:0;padding:0;color:var(--muted);text-align:left;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.rk .car{display:inline-block;font-size:11px;transition:transform .15s}
.rk[aria-expanded="true"] .car{transform:rotate(180deg)}
.det{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13.5px;color:var(--muted);padding:2px 0 4px 12px;border-left:2px solid var(--line)}
.det .new{color:var(--fg)}
.det .act{display:inline-flex;gap:10px;align-items:baseline;justify-content:flex-end}
.cons{color:var(--accent);font-weight:600}
.sep{grid-column:1/-1;border-top:1px solid var(--line);margin:2px 0}
.left.v{font-size:20px;font-weight:600}
.neg{color:var(--warn)}
.add{align-self:flex-start}
.form{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.form .rows{grid-template-columns:auto 1fr}
.form .rows input:not(.txt){justify-self:end}
.fbtn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.primary{font:inherit;font-weight:600;background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:8px 18px;cursor:pointer}
.danger{color:var(--warn)}
.err{color:var(--warn);font-size:13px;min-height:1em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:521px){.tabs{grid-template-columns:repeat(12,1fr)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
const ENTRATA=1100, USCITE=250, ABB=40.99, CUSC=200, KEY="risparmio-v1";
const RATE=[
 ["2026-10-29",43.28],["2026-10-29",42.00],["2026-10-30",45.99],["2026-10-31",62.48],
 ["2026-11-03",44.25],["2026-11-03",27.33],["2026-11-04",42.31],["2026-11-05",14.55],["2026-11-09",36.44],["2026-11-09",38.73],["2026-11-10",90.51],["2026-11-11",16.22],
 ["2026-11-14",11.75],["2026-11-18",84.86],["2026-11-21",12.84],["2026-11-29",43.28],["2026-11-29",42.00],["2026-11-30",45.99],
 ["2026-12-04",42.31],["2026-12-11",16.18],["2026-12-18",84.86],["2026-12-30",45.99],
 ["2027-01-04",42.31],["2027-01-18",84.86],["2027-01-30",45.99],
 ["2027-02-04",42.31],["2027-02-18",84.86],["2027-02-28",45.99],
 ["2027-03-04",42.31],["2027-03-18",84.86],["2027-03-30",45.99],
 ["2027-04-30",45.99],["2027-05-30",45.99],["2027-06-30",45.99],["2027-07-30",45.99],["2027-08-30",45.99],["2027-09-30",45.99],
 ["2027-10-30",45.87]
];
const MN=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const AB=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const pad=n=>String(n).padStart(2,"0");
const keyOf=(y,m)=>y+"-"+pad(m);
function cycleOfDate(s){let [y,m,d]=s.split("-").map(Number); if(d<14){m--; if(m===0){m=12;y--}} return keyOf(y,m)}

const CICLI=[];
for(let y=2026,m=10; y<2027||(y===2027&&m<=12); m===12?(m=1,y++):m++){
  const nm=m===12?1:m+1;
  CICLI.push({k:keyOf(y,m),y,m,ab:AB[m-1],nome:MN[m-1]+" "+y,per:`14/${pad(m)} – 13/${pad(nm)}`,base:ENTRATA+CUSC,spese:USCITE,lab:"saldo al 15"});
}
Object.assign(CICLI[0],{per:"21/10 – 13/11",base:1376.13,spese:200,lab:"saldo al 21/10"});
CICLI.forEach((c,i)=>{
  c.i=i;
  c.rate=RATE.filter(r=>cycleOfDate(r[0])===c.k);
  c.rateBase=Math.round(c.rate.reduce((s,r)=>s+r[1],0)*100)/100;
  c.bl=c.base-(c.rateBase+ABB+CUSC);
  c.quota=c.bl>0?Math.max(0,(c.bl-c.spese)/c.bl):0;
});
const idxOf=k=>CICLI.findIndex(c=>c.k===k);

let state={versato:{},saldo:{},nuove:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&typeof s==="object"){state.versato=s.versato||{};state.saldo=s.saldo||{};state.nuove=Array.isArray(s.nuove)?s.nuove:[]}}catch(e){}
state.nuove=state.nuove.filter(x=>x&&x.da).map(x=>Array.isArray(x.vs)?x:{id:x.id,nome:x.nome,da:x.da,vs:Array(x.n||1).fill(x.v||0)});
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

const r2=n=>Math.round(n*100)/100;
const fmt=n=>r2(n).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const fmt0=n=>Math.round(n).toLocaleString("it-IT")+" €";
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const consOf=(lib,q)=>lib<=0?0:Math.max(0,Math.floor(lib*q/10+1e-9)*10);
const parseNum=t=>{let s=String(t).trim().replace(/\s|€/g,""); if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const v=parseFloat(s); return s===""||isNaN(v)?null:v};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
let selK=(CICLI.find(c=>!has(state.versato,c.k))||CICLI[CICLI.length-1]).k;
let detOpen=false, editId=null;

function nuoveIn(c){
  return state.nuove.map(x=>{const a=idxOf(x.da), pos=c.i-a+1; return {...x,a,pos,n:x.vs.length,v:x.vs[pos-1]}}).filter(x=>x.a>=0&&x.pos>=1&&x.pos<=x.n);
}
function calc(){
  const r=CICLI.map(c=>{
    const nv=nuoveIn(c), rateNew=r2(nv.reduce((s,x)=>s+x.v,0));
    const entr=has(state.saldo,c.k)?Number(state.saldo[c.k]):c.base;
    const imp=c.rateBase+rateNew+ABB+CUSC;
    const cons=consOf(entr-imp,c.quota), baseCons=consOf(c.bl,c.quota);
    const vsSet=has(state.versato,c.k), vs=vsSet?Number(state.versato[c.k]):0;
    return {...c,nv,rateNew,entr,cons,baseCons,vs,vsSet,resta:r2(entr-imp-(vsSet?vs:cons))};
  });
  return {r,
    versato:r.reduce((s,x)=>s+x.vs,0),
    obiettivo:r.reduce((s,x)=>s+x.baseCons,0),
    proj:r.reduce((s,x)=>s+(x.vsSet?x.vs:x.cons),0)};
}

function shell(){
  const group=y=>`<div><p class="yr">${y}</p><nav class="tabs" role="tablist" aria-label="mesi ${y}">${CICLI.filter(c=>c.y===y).map(c=>`
    <button type="button" class="tab" role="tab" id="tab-${c.k}" data-k="${c.k}"><span class="t">${c.ab}</span><span class="a" id="tab-a-${c.k}"></span></button>`).join("")}</nav></div>`;
  $("app").innerHTML=`
  <header>
    <h1>Risparmio</h1>
    <p class="sub">ottobre 2026 – dicembre 2027</p>
  </header>
  <section class="progress">
    <div class="top"><span class="big num" id="p-real"></span><span class="of num" id="p-goal"></span></div>
    <div class="bar" aria-hidden="true"><b id="p-projbar"></b><i id="p-bar"></i></div>
    <span class="proj num" id="p-proj"></span>
  </section>
  <section class="months">${group(2026)}${group(2027)}</section>
  <section class="panel" role="tabpanel">
    <div><h2 id="pn-title"></h2><p class="per" id="pn-per"></p></div>
    <div class="rows">
      <label class="k" for="pn-saldo" id="pn-saldo-l">saldo</label><span class="inrow"><input type="text" id="pn-saldo" data-f="saldo" inputmode="decimal" autocomplete="off"></span>
      <button type="button" class="rk" id="pn-rate-t" aria-expanded="false" aria-controls="pn-det">rate <span class="car">▾</span></button><span class="v num" id="pn-rate"></span>
      <div class="det" id="pn-det" hidden></div>
      <span class="k">abbonamenti</span><span class="v num" id="pn-abb"></span>
      <span class="k">cuscinetto</span><span class="v num" id="pn-cusc"></span>
      <span class="k">consigliato</span><span class="v num cons" id="pn-cons"></span>
      <label class="k" for="pn-versato">versato</label><span class="inrow"><button type="button" class="link" id="pn-use">= consigliato</button><input type="text" id="pn-versato" data-f="versato" inputmode="decimal" autocomplete="off"></span>
      <span class="sep"></span>
      <span class="k">ti resta</span><span class="v num left" id="pn-left"></span>
    </div>
    <button type="button" class="link add" id="pn-add">+ aggiungi rata</button>
    <div class="form" id="pn-form" hidden>
      <div class="rows">
        <label class="k" for="f-nome">descrizione</label><input type="text" class="txt" id="f-nome" autocomplete="off">
        <label class="k" for="f-tot">importo totale</label><input type="text" id="f-tot" inputmode="decimal" autocomplete="off">
        <label class="k" for="f-n">numero di rate</label><input type="text" id="f-n" inputmode="numeric" autocomplete="off" placeholder="3">
      </div>
      <div class="rows" id="f-split"></div>
      <span class="err" id="f-err"></span>
      <div class="fbtn"><button type="button" class="primary" id="f-ok">aggiungi</button><button type="button" class="link danger" id="f-del" hidden>elimina</button><button type="button" class="link" id="f-no">annulla</button></div>
    </div>
  </section>`;
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{selK=t.dataset.k;closeForm();fillPanel();update()}));
  ["saldo","versato"].forEach(f=>$("pn-"+f).addEventListener("input",e=>{
    const v=parseNum(e.target.value);
    if(v===null) delete state[f][selK]; else state[f][selK]=r2(v);
    persist(); update();
  }));
  $("pn-use").addEventListener("click",()=>{
    const x=calc().r.find(z=>z.k===selK);
    state.versato[selK]=x.cons; persist(); fillPanel(); update();
  });
  $("pn-rate-t").addEventListener("click",()=>{detOpen=!detOpen;update()});
  $("pn-det").addEventListener("click",e=>{const b=e.target.closest("[data-edit]"); if(b) openForm(b.dataset.edit)});
  $("pn-add").addEventListener("click",()=>openForm(null));
  $("f-no").addEventListener("click",closeForm);
  $("f-del").addEventListener("click",()=>{state.nuove=state.nuove.filter(x=>x.id!==editId);persist();closeForm();update()});
  const resplit=()=>{
    const tot=parseNum($("f-tot").value), n=parseInt($("f-n").value||"0",10);
    split=(tot>0&&n>=1&&n<=60)?splitAmounts(tot,n):[]; renderSplit();
  };
  $("f-tot").addEventListener("input",resplit);
  $("f-n").addEventListener("input",resplit);
  $("f-split").addEventListener("input",e=>{
    const i=Number(e.target.dataset.i), v=parseNum(e.target.value);
    split[i]=v===null?0:r2(v);
    $("f-tot").value=money(split.reduce((s,a)=>s+a,0));
  });
  $("f-ok").addEventListener("click",()=>{
    const nome=$("f-nome").value.trim()||"rata";
    if(!split.length){$("f-err").textContent="importo totale o numero di rate mancante";return}
    if(split.some(a=>!(a>0))){$("f-err").textContent="una rata è vuota";return}
    const vs=split.map(r2);
    if(editId){const x=state.nuove.find(z=>z.id===editId); Object.assign(x,{nome,vs})}
    else state.nuove.push({id:Date.now().toString(36),nome,vs,da:selK});
    persist(); detOpen=true; closeForm(); update();
  });
}

let split=[];
const money=v=>r2(v).toFixed(2).replace(".",",");
function splitAmounts(tot,n){
  const c=Math.round(tot*100), b=Math.floor(c/n), arr=Array(n).fill(b);
  arr[n-1]+=c-b*n;
  return arr.map(x=>x/100);
}
function renderSplit(){
  $("f-split").innerHTML=split.map((a,i)=>`<label class="k" for="f-r${i}">rata ${i+1}</label><input type="text" id="f-r${i}" data-i="${i}" inputmode="decimal" autocomplete="off" value="${money(a)}">`).join("");
}
function openForm(id){
  editId=id; const x=id?state.nuove.find(z=>z.id===id):null;
  split=x?x.vs.slice():[];
  $("f-nome").value=x?x.nome:""; $("f-tot").value=x?money(split.reduce((s,a)=>s+a,0)):""; $("f-n").value=x?split.length:"";
  renderSplit();
  $("f-ok").textContent=x?"salva":"aggiungi"; $("f-del").hidden=!x; $("f-err").textContent="";
  $("pn-form").hidden=false; $("pn-add").hidden=true; $("f-tot").focus();
}
function closeForm(){editId=null;$("pn-form").hidden=true;$("pn-add").hidden=false}

function fillPanel(){
  ["saldo","versato"].forEach(f=>{$("pn-"+f).value=has(state[f],selK)?String(state[f][selK]).replace(".",","):""});
}

function update(){
  const c=calc();
  $("p-real").textContent=fmt(c.versato);
  $("p-goal").textContent="di "+fmt0(c.obiettivo);
  $("p-bar").style.width=Math.min(100,c.versato/c.obiettivo*100).toFixed(1)+"%";
  $("p-projbar").style.width=Math.min(100,c.proj/c.obiettivo*100).toFixed(1)+"%";
  $("p-proj").textContent="proiezione a dicembre 2027 "+fmt0(c.proj);
  c.r.forEach(x=>{
    const t=$("tab-"+x.k);
    t.setAttribute("aria-selected",x.k===selK?"true":"false");
    t.classList.toggle("done",x.vsSet);
    $("tab-a-"+x.k).textContent=x.vsSet?fmt0(x.vs):"—";
  });
  const x=c.r.find(z=>z.k===selK);
  $("pn-title").textContent=x.nome;
  $("pn-per").textContent=x.per;
  $("pn-saldo-l").textContent=x.lab;
  $("pn-saldo").placeholder=fmt(x.base).replace(" €","");
  $("pn-rate").textContent=fmt(x.rateBase+x.rateNew);
  $("pn-rate-t").setAttribute("aria-expanded",String(detOpen));
  const det=$("pn-det"); det.hidden=!detOpen;
  det.innerHTML=x.rate.map(r=>`<span>${r[0].slice(8)}/${r[0].slice(5,7)}</span><span class="num">${fmt(r[1])}</span>`).join("")
    +x.nv.map(n=>`<span class="new">${esc(n.nome)} · ${n.pos}/${n.n}</span><span class="act"><span class="num new">${fmt(n.v)}</span><button type="button" class="link" data-edit="${n.id}">modifica</button></span>`).join("")
    +(x.rate.length||x.nv.length?"":`<span>nessuna</span><span></span>`);
  $("pn-abb").textContent=fmt(ABB);
  $("pn-cusc").textContent=fmt(CUSC);
  $("pn-cons").textContent=fmt(x.cons);
  $("pn-versato").placeholder=String(x.cons);
  $("pn-left").textContent=fmt(x.resta);
  $("pn-left").className="v num left"+(x.resta<0?" neg":"");
}

shell(); fillPanel(); update();
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTap=0;
document.addEventListener("touchend",e=>{const n=Date.now(); if(n-lastTap<300&&!e.target.closest("input,button,label")) e.preventDefault(); lastTap=n},{passive:false});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
</body>
</html>
